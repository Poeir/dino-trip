[pytest]
# Tests import `src.*`; the bare `pytest` command (unlike `python -m pytest`)
# doesn't put the current directory on sys.path, so say so explicitly.
pythonpath = .
markers =
    live: hits the real LLM (KKU gateway) and Supabase DB -- costs real API calls and takes real time. Excluded from the default run. Run explicitly with `pytest -m live`.
addopts = -m "not live"
