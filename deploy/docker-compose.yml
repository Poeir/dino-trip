# chatbot-service on a single VPS: Caddy terminates HTTPS and proxies to the
# FastAPI container. Run from this directory:  docker compose up -d --build
services:
  chatbot:
    build: ../chatbot-service
    env_file: ./chatbot.env
    environment:
      PORT: "8000"
    volumes:
      # Keeps the downloaded embedding model across rebuilds/restarts.
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    # Not published to the host: only Caddy (same compose network) can reach it.

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:?set CHAT_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - chatbot
    restart: unless-stopped

volumes:
  hf_cache:
  caddy_data:
