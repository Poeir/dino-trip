          description: การตั้งค่าและสถานะ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoSyncStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin Place Auto Sync]
      operationId: adminUpdatePlaceAutoSync
      summary: "[Admin] บันทึกการตั้งค่าซิงก์อัตโนมัติ"
      description: 'ส่งเฉพาะค่าที่ต้องการเปลี่ยนได้ · ค่าเกินช่วงที่อนุญาต → 400 · คืนสถานะล่าสุด'
