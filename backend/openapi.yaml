openapi: 3.0.3
info:
  title: Dino Khon Kaen API
  version: 0.1.0
  description: |
    REST API ของ backend (Express) สำหรับเว็บ Dino Khon Kaen — สถานที่ อีเวนท์ ฐานความรู้แชทบอท QR สะสมแต้ม
    ของรางวัล แผนทริป โปรไฟล์ แบบสอบถาม และหน้าผู้ดูแลระบบ

    **การยืนยันตัวตน:** ใช้ session cookie ชื่อ `session_token` (httpOnly, `sameSite: lax`, อายุ 30 วัน)
    ซึ่งได้จาก `POST /api/auth/login` (หรือ `/confirm`, `/reset-password`) — frontend เรียกด้วย
    `credentials: 'include'` ไม่มี bearer token
    - `x-auth: public` — ไม่ต้องล็อกอิน
    - `x-auth: optional` — ล็อกอินหรือไม่ก็ได้ (ผลลัพธ์ต่างกัน)
    - `x-auth: user` — ต้องล็อกอิน (ไม่มี cookie → 401 `กรุณาเข้าสู่ระบบก่อน`)
    - `x-auth: admin` — ต้องล็อกอินและ role = `admin` (ไม่ใช่ admin → 403 `ไม่มีสิทธิ์เข้าถึงส่วนนี้`)

    **รูปแบบ error:** ทุก error ตอบเป็น JSON `{ "error": { "message": "<ข้อความภาษาไทย>" } }`
    (ยกเว้น 404 ของ `/api/users/{id}/avatar` ที่ไม่มี body และหน้า SEO ที่ตอบเป็น HTML)
    - 400 ข้อมูลไม่ถูกต้อง (รวมถึง id ที่ไม่ใช่ uuid → `ข้อมูลที่ส่งมาไม่ถูกต้อง`)
    - 401/403 สิทธิ์ · 404 ไม่พบ · 409 ขัดแย้ง · 429 เรียกถี่เกินไป (มี header `Retry-After`)
    - 500 `เกิดข้อผิดพลาดของระบบ กรุณาลองใหม่อีกครั้ง` · 502 ติดต่อบริการภายนอกไม่ได้
    - 503 `ฐานข้อมูลยังไม่เป็นปัจจุบัน ...` เมื่อยังไม่ได้รัน migration ล่าสุด

    **Rate limit:** ทุก `/api/*` มีเพดานรวม 1200 ครั้ง/นาที/IP และบาง endpoint มีเพดานเฉพาะ (ระบุในคำอธิบาย)
    นับในหน่วยความจำของ process เดียว

    **Cache:** รายการจาก crudRouter (places, events, knowledge-base, qrs, rewards) cache ในหน่วยความจำ 25 วินาที
    ต่อชุด query string — ข้อมูลที่เพิ่งแก้ผ่านช่องทางอื่นอาจเห็นช้าไม่เกิน 25 วินาที
  contact:
    name: Dino Khon Kaen
servers:
  - url: http://localhost:4000
    description: Local dev (npm run dev)
  - url: https://dinokhonkaen.app
    description: Production (Caddy proxy /api → backend)
# Default = public. Operations that need a session declare their own `security`.
security: []
tags:
  - name: Health
    description: ตรวจสุขภาพระบบ
  - name: SEO
    description: robots.txt, sitemap และหน้า pre-render สำหรับ crawler (Caddy ส่งเฉพาะ bot มาที่นี่)
  - name: Auth
    description: สมัครสมาชิก ยืนยันอีเมล ล็อกอิน/ออก รีเซ็ตรหัสผ่าน
  - name: Places
    description: สถานที่ท่องเที่ยว (อ่านได้ทุกคน แก้ไขได้เฉพาะ admin)
  - name: Place Reports
    description: ผู้ใช้แจ้งข้อมูลสถานที่ผิด และคิวตรวจสอบของ admin
  - name: Events
    description: อีเวนท์/กิจกรรม
  - name: Event Reports
    description: ผู้ใช้แจ้งข้อมูลอีเวนท์ผิด และคิวตรวจสอบของ admin
  - name: Event Requests
    description: ผู้ใช้เสนออีเวนท์ใหม่ให้ admin อนุมัติ
  - name: Survey
    description: แบบสอบถามความพึงพอใจ (ไม่ระบุตัวตน)
  - name: Knowledge Base
    description: ฐานความรู้ของแชทบอท (RAG)
  - name: QR & Points
    description: QR สะสมแต้ม การสแกน และยอดแต้ม
  - name: Rewards
    description: ของรางวัลสำหรับแลกแต้ม
  - name: Trips
    description: แผนทริปที่บันทึกไว้ของผู้ใช้
  - name: Profile
    description: บัญชีของผู้ใช้ที่ล็อกอินอยู่
  - name: Users
    description: รูปโปรไฟล์สาธารณะ
  - name: Admin Users
    description: "[Admin] จัดการบัญชีผู้ใช้"
  - name: Admin Redemptions
    description: "[Admin] แลกของรางวัลที่เคาน์เตอร์"
  - name: Admin Stats
    description: "[Admin] สถิติแดชบอร์ด และเวอร์ชันระบบ"
  - name: Admin Trips
    description: "[Admin] ดูแผนทริปทั้งหมด"
  - name: Admin Survey
    description: "[Admin] สรุปผลแบบสอบถาม"
  - name: Admin Place Sync
    description: "[Admin] ซิงก์ข้อมูลจาก Google Places และล็อกฟิลด์ (ทุกการซิงก์คือ 1 คำขอ Places API ที่มีค่าใช้จ่าย)"
  - name: Admin Place Import
    description: "[Admin] เพิ่มสถานที่จาก Google Maps"
  - name: Admin Place Candidates
    description: "[Admin] สถานที่จาก Google ที่แชทบอทแนะนำ: ร้าน/ที่เที่ยวจาก Google ที่แชทบอทแสดงตอบคำถาม \"แถว X\" ที่ข้อมูลเรายังน้อย"
  - name: Admin Place Auto Sync
    description: "[Admin] ตั้งค่าและดูสถานะการซิงก์ข้อมูลจาก Google อัตโนมัติ (คุมงบด้วยเพดานคำขอต่อเดือน)"
  - name: Admin Cost Estimates
    description: "[Admin] ประมาณค่าใช้จ่ายต่อการกดปุ่มที่เรียก API เสียเงิน (ไม่เก็บอะไรลงฐานข้อมูล)"
  - name: Admin Reindex
    description: "[Admin] สั่ง embed ข้อมูลใหม่ใน chatbot-service"

paths:
  # ---------------------------------------------------------------- Health
  /:
    get:
      tags: [Health]
      operationId: getRoot
      summary: ข้อมูลชื่อ API
      x-auth: public
      responses:
        '200':
          description: ชื่อ API
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: Dino Khon Kaen API }
                  docs: { type: string, example: /api }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check (ภายใน)
      description: รัน `select 1` กับฐานข้อมูลจริง ตอบ 503 เมื่อเชื่อมต่อฐานข้อมูลไม่ได้
      x-auth: public
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDown' }
  /api/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Health check (ผ่าน reverse proxy)
      description: เหมือน `/health` แต่อยู่ใต้ `/api` เพื่อให้เรียกผ่าน Caddy ได้
      x-auth: public
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDown' }

  # ---------------------------------------------------------------- SEO
  /robots.txt:
    get:
      tags: [SEO]
      operationId: getRobotsTxt
      summary: robots.txt
      description: บล็อกหน้าส่วนตัว (admin, profile, ผลทริป ฯลฯ) และชี้ไปที่ sitemap · Cache-Control 1 ชั่วโมง
      x-auth: public
      responses:
        '200':
          description: ไฟล์ข้อความ
          content:
            text/plain:
              schema: { type: string }
  /sitemap.xml:
    get:
      tags: [SEO]
      operationId: getSitemap
      summary: sitemap.xml
      description: หน้าหลัก + สถานที่ที่เปิดใช้งาน + อีเวนท์ที่ยังไม่จบ/ไม่ยกเลิก · cache ในเซิร์ฟเวอร์ 10 นาที
      x-auth: public
      responses:
        '200':
          description: XML sitemap
          content:
            application/xml:
              schema: { type: string }
  /api/seo/page/{path}:
    get:
      tags: [SEO]
      operationId: getSeoPage
      summary: หน้า HTML pre-render สำหรับ crawler
      description: |
        Caddy rewrite มาที่นี่เฉพาะเมื่อ User-Agent เป็น bot/link preview — คนทั่วไปได้ SPA
        `path` คือ path ของเว็บ เช่น `places/<uuid>`, `events/<uuid>`, `places`, `events`, `trip`
        (ส่วน `/` ของหน้าแรกคือ `/api/seo/page/`) · cache 5 นาที · ไม่พบ → 404 พร้อมหน้า HTML "ไม่พบหน้า"
      x-auth: public
      parameters:
        - name: path
          in: path
          required: true
          description: path ของหน้าเว็บ (อาจมี `/` ได้)
          schema: { type: string, example: places/28d1ae32-daa7-401a-8f95-028644a42a1d }
      responses:
        '200':
          description: หน้า HTML พร้อม meta/OG/JSON-LD
          content:
            text/html:
              schema: { type: string }
        '404':
          description: ไม่มีหน้าสาธารณะที่ path นี้
          content:
            text/html:
              schema: { type: string }

  # ---------------------------------------------------------------- Auth
  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: สมัครสมาชิก
      description: |
        ส่งแบบ `multipart/form-data` เพื่อแนบรูปโปรไฟล์ (`avatarFile`, ≤2MB, jpg/png/webp/gif) ได้ในคำขอเดียว
        หรือเลือก preset ผ่าน `avatarUrl: "preset:<key>"` · สำเร็จแล้วระบบส่งอีเมลยืนยัน — ยังล็อกอินไม่ได้จนกว่าจะยืนยัน
        **Rate limit:** 20 ครั้ง/ชั่วโมง/IP
      x-auth: public
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SignupInput' }
          application/json:
            schema: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '201':
          description: สร้างบัญชีแล้ว รอยืนยันอีเมล
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingConfirmation: { type: boolean, example: true }
                  email: { type: string, format: email }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmail
      summary: ยืนยันอีเมลจากลิงก์
      description: รับ token จากลิงก์ในอีเมล (`/confirm?token=`) ยืนยันแล้วล็อกอินทันที (ตั้ง cookie) · **Rate limit:** 30 ครั้ง/15 นาที/IP
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '200': { $ref: '#/components/responses/UserWithCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: เข้าสู่ระบบ
      description: |
        สำเร็จ → ตั้ง cookie `session_token` (httpOnly) — ใช้ cookie นี้กับทุก endpoint ที่ต้องล็อกอิน
        อีเมลผิด/รหัสผิด/บัญชีถูกลบ ตอบเหมือนกัน (401) · บัญชีถูกระงับหรือยังไม่ยืนยันอีเมล → 403
        **Rate limit:** 100 ครั้ง/15 นาที/IP และ 10 ครั้ง/15 นาที ต่อ IP+อีเมล
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: tourist@example.com }
                password: { type: string, format: password, example: Passw0rd! }
      responses:
        '200': { $ref: '#/components/responses/UserWithCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: ขอลิงก์รีเซ็ตรหัสผ่าน
      description: ตอบข้อความเดียวกันเสมอไม่ว่าอีเมลจะมีในระบบหรือไม่ (กันการเดาบัญชี) · **Rate limit:** 10 ครั้ง/ชั่วโมง/IP และ 3 ครั้ง/ชั่วโมง/อีเมล
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: ตั้งรหัสผ่านใหม่ด้วย token
      description: ตั้งรหัสผ่านใหม่ ยืนยันอีเมลให้ ยกเลิก session อื่นทั้งหมด แล้วล็อกอิน (ตั้ง cookie) · **Rate limit:** 30 ครั้ง/15 นาที/IP
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, description: 'อย่างน้อย 8 ตัว มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข' }
      responses:
        '200': { $ref: '#/components/responses/UserWithCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: ออกจากระบบ
      description: ลบ session ปัจจุบันและล้าง cookie (เรียกได้แม้ไม่ได้ล็อกอิน)
      x-auth: public
      responses:
        '204': { description: ออกจากระบบแล้ว }
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: ผู้ใช้ปัจจุบันจาก cookie
      description: 'ไม่ได้ล็อกอิน (หรือ session หมดอายุ/บัญชีถูกระงับ) → `{ "user": null }` ไม่ใช่ 401'
      x-auth: optional
      security: [{}, { cookieAuth: [] }]
      responses:
        '200':
          description: ผู้ใช้ หรือ null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    allOf: [{ $ref: '#/components/schemas/User' }]
                    nullable: true

  # ---------------------------------------------------------------- Places
  /api/places:
    get:
      tags: [Places]
      operationId: listPlaces
      summary: รายการสถานที่
      description: |
        ไม่ส่ง `page`/`limit` → ได้ array ทั้งหมด (ใช้ตอนโหลดหน้าแรก) · ส่ง `page` หรือ `limit` → ได้ object แบ่งหน้า
        เรียงตามคะแนนถ่วงน้ำหนัก (ปักหมุดก่อน) เว้นแต่ส่ง `sort=name|rating` · ผลลัพธ์ cache 25 วินาที
        `?ids=` (คั่นด้วย comma) ไม่ถูก cache
      x-auth: public
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: '`name`/`rating` = เรียงตามคอลัมน์ (เฉพาะโหมดแบ่งหน้า) · `popular`/`topRated` = รูปแบบการจัดอันดับ'
          schema: { type: string, enum: [name, rating, popular, topRated] }
        - $ref: '#/components/parameters/Dir'
        - name: category
          in: query
          schema: { type: string, example: ร้านอาหาร }
        - name: subcategory
          in: query
          schema: { type: string, example: ก๋วยเตี๋ยว }
        - name: district
          in: query
          description: อำเภอ (ตรงทุกตัวอักษร ไม่มีคำว่า "อำเภอ" นำหน้า เช่น `เมืองขอนแก่น`) — ดูรายการจาก `/api/places/meta/areas`
          schema: { type: string, example: ชุมแพ }
        - name: subdistrict
          in: query
          description: ตำบล (ตรงทุกตัวอักษร ไม่มีคำว่า "ตำบล" นำหน้า)
          schema: { type: string, example: ศิลา }
        - name: isActive
          in: query
          description: '`true` = เฉพาะที่แสดงต่อสาธารณะ (หน้าเว็บส่งค่านี้, admin ไม่ส่ง)'
          schema: { type: string, enum: ['true', 'false'] }
        - name: hasQR
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: array (ไม่แบ่งหน้า) หรือ object แบ่งหน้า
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Place' }
                  - $ref: '#/components/schemas/PlacePage'
    post:
      tags: [Places]
      operationId: createPlace
      summary: "[Admin] เพิ่มสถานที่"
      description: สร้างสถานที่ใหม่ (ล้าง `embedding` — ต้อง reindex เพื่อให้แชทบอทค้นเจอ)
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/places/meta/names:
    get:
      tags: [Places]
      operationId: listPlaceNames
      summary: รายชื่อสถานที่แบบย่อ (id + name)
      description: ใช้ใน datalist เลือกสถานที่จัดงานของฟอร์มอีเวนท์ · รวมสถานที่ที่ซ่อนอยู่ · cache 25 วินาที
      x-auth: public
      responses:
        '200':
          description: รายชื่อเรียงตามชื่อ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
  /api/places/meta/areas:
    get:
      tags: [Places]
      operationId: listPlaceAreas
      summary: อำเภอ → ตำบล พร้อมจำนวนสถานที่
      description: ใช้เป็นตัวเลือกกรองอำเภอ/ตำบลในหน้าจัดการสถานที่ · เรียงอำเภอจากมากไปน้อย · รวมสถานที่ที่ซ่อนอยู่ · cache 25 วินาที
      x-auth: public
      responses:
        '200':
          description: รายการอำเภอ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, example: เมืองขอนแก่น }
                    count: { type: integer }
                    subdistricts:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string, example: ศิลา }
                          count: { type: integer }
  /api/places/describe:
    post:
      tags: [Places]
      operationId: describePlace
      summary: "[Admin] สร้างคำอธิบายสถานที่ด้วย AI"
      description: |
        ส่งต่อไปยัง chatbot-service (`/admin/places/describe`) ใช้รีวิว + ผลค้นหา Google สรุปด้วย LLM
        ไม่บันทึกอะไร — คืนข้อความให้ admin ตรวจ · **Rate limit:** 60 ครั้ง/ชั่วโมง/admin
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                placeId: { type: string, format: uuid, nullable: true }
                name: { type: string, maxLength: 200 }
                category: { type: string, maxLength: 100 }
                district: { type: string, nullable: true }
                tags: { type: array, items: { type: string }, maxItems: 30 }
                amenities: { type: array, items: { type: string }, maxItems: 50 }
      responses:
        '200':
          description: คำอธิบายที่สร้าง
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
                  source: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/places/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Places]
      operationId: getPlace
      summary: สถานที่ 1 แห่ง
      description: 'คืนแม้สถานที่ถูกซ่อน (`isActive: false`) · cache 25 วินาที'
      x-auth: public
      responses:
        '200':
          description: สถานที่
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Places]
      operationId: updatePlace
      summary: "[Admin] แก้ไขสถานที่"
      description: |
        ส่งข้อมูลทั้งฟอร์ม · ถ้าสถานที่มาจาก Google และ admin แก้ฟิลด์ที่ซิงก์ได้ (name, address, location, hours, phone,
        website, business_status) ฟิลด์นั้นจะถูก **ล็อก** อัตโนมัติ และรายงานของผู้ใช้เกี่ยวกับฟิลด์นั้นจะถูกปิดเป็น `edited`
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '200':
          description: สถานที่หลังแก้ไข
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Places]
      operationId: deletePlace
      summary: "[Admin] ลบสถานที่"
      description: ลบถาวร พร้อมลบรูปใน Cloudinary (ทำหลังลบสำเร็จ)
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: ลบแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
