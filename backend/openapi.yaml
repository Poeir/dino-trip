          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Survey
  /api/survey/questions:
    get:
      tags: [Survey]
      operationId: getSurveyQuestions
      summary: คำถามแบบสอบถาม
      description: ไม่แตะฐานข้อมูล — ข้อมูลจาก `lib/surveyQuestions.js`
      x-auth: public
      responses:
        '200':
          description: สเกล มิติ คำถาม 16 ข้อ ข้อมูลประชากร และประสบการณ์
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyQuestions' }
  /api/survey/status:
    get:
      tags: [Survey]
      operationId: getSurveyStatus
      summary: เครื่องนี้ตอบแล้วหรือยัง
      description: ดูจาก cookie `survey_done`
      x-auth: public
      responses:
        '200':
          description: สถานะ
          content:
            application/json:
              schema:
                type: object
                properties:
                  submitted: { type: boolean }
  /api/survey:
    post:
      tags: [Survey]
      operationId: submitSurvey
      summary: ส่งแบบสอบถาม
      description: |
        ไม่ระบุตัวตน 1 คำตอบต่อเบราว์เซอร์ (ตั้ง cookie `survey_done` อายุ 1 ปี) · ช่อง `website` คือ honeypot
        (ถ้ามีค่า → ตอบ 201 แต่ไม่บันทึก) · **Rate limit:** 40 ครั้ง/ชั่วโมง/IP
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveySubmission' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

