    put:
      tags: [Rewards]
      operationId: updateReward
      summary: "[Admin] แก้ไขของรางวัล"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardInput' }
      responses:
        '200':
          description: หลังแก้ไข
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Rewards]
      operationId: deleteReward
      summary: "[Admin] ลบของรางวัล"
