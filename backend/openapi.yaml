        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Trips
  /api/trips:
    get:
      tags: [Trips]
      operationId: listMyTrips
      summary: แผนทริปของฉัน
      description: ใหม่สุดก่อน · ค่าเริ่มต้น 12 ต่อหน้า (สูงสุด 50) · `search` ค้นชื่อทริป · `favorite=1` เฉพาะที่ติดดาว
      x-auth: user
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: favorite
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: ทริปแบ่งหน้า
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Trips]
      operationId: saveTrip
      summary: บันทึกแผนทริป
      description: |
        รับแผนที่ได้จาก chatbot-service (`/trip/llm`) — ตรวจทุกค่า และยืนยันว่า placeId มีอยู่จริง (ชื่อสถานที่อ่านจากตาราง)
        **ล็อกอิน** → บันทึกเป็นของผู้ใช้ (สูงสุด 50 แผน) ตอบ 201 พร้อมแผนเต็ม
        **ไม่ล็อกอิน** → บันทึกไว้ทำสถิติเท่านั้น ตอบ 202 `{ "id": null }`
        **Rate limit:** 30 ครั้ง/ชั่วโมง/IP
      x-auth: optional
      security: [{}, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripSaveInput' }
      responses:
        '201':
          description: บันทึกเป็นของผู้ใช้แล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '202':
          description: บันทึกแบบไม่ระบุเจ้าของ (ไม่ได้ล็อกอิน)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, nullable: true, example: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      operationId: getMyTrip
      summary: แผนทริปของฉัน 1 แผน
      description: ทริปของคนอื่นตอบ 404 เหมือนไม่มีอยู่ · แต่ละ stop มี `place` ปัจจุบัน (null ถ้าถูกลบ)
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: แผนเต็ม
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trips]
      operationId: updateMyTrip
      summary: เปลี่ยนชื่อ / ติดดาวทริป
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120, example: เที่ยวขอนแก่นกับครอบครัว }
                isFavorite: { type: boolean }
      responses:
        '200':
          description: สรุปทริปหลังแก้ไข
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trips]
      operationId: deleteMyTrip
      summary: ลบทริป
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: ลบแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trips/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Trips]
      operationId: rateTripItem
      summary: กดชอบ/ไม่ชอบ stop ในทริป
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean, nullable: true, description: 'null = ล้างการโหวต' }
      responses:
        '200':
          description: ค่าใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  liked: { type: boolean, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trips/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      operationId: duplicateMyTrip
      summary: ทำสำเนาทริป
      description: ชื่อใหม่ต่อท้าย " (สำเนา)" · นับรวมเพดาน 50 แผน · **Rate limit:** 30 ครั้ง/ชั่วโมง/IP (ร่วมกับการบันทึก)
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: สรุปทริปที่สร้างใหม่
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Profile
  /api/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: โปรไฟล์ของฉัน
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: โปรไฟล์ + สถิติแต้ม + อีเมลที่รอยืนยัน
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          scans: { type: integer }
                          pointsEarned: { type: integer }
                          redemptions: { type: integer }
                          pointsSpent: { type: integer }
                      pendingEmail: { type: string, format: email, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: แก้ข้อมูลส่วนตัว
      description: ต้องส่งครบทุกช่อง (เหมือนตอนสมัคร) · แก้ role/แต้ม/อีเมลผ่านทางนี้ไม่ได้ · **Rate limit:** 30 ครั้ง/นาที/ผู้ใช้
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileFieldsInput' }
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      operationId: deleteMyAccount
      summary: ลบบัญชีของฉัน (soft delete)
      description: ยืนยันด้วยรหัสผ่าน · admin คนสุดท้ายลบตัวเองไม่ได้ (409) · ล้าง cookie · **Rate limit:** 5 ครั้ง/15 นาที/ผู้ใช้
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirm' }
      responses:
        '204': { description: ลบบัญชีแล้ว }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/profile/history:
    get:
      tags: [Profile]
      operationId: pointsHistory
      summary: ประวัติแต้ม (สแกน / แลก / ปรับโดย admin)
      description: ใหม่สุดก่อน · ค่าเริ่มต้น 20 ต่อหน้า (สูงสุด 50)
      x-auth: user
      security: [{ cookieAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [all, scan, redeem, adjust], default: all }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: ประวัติแบ่งหน้า
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, example: 'scan:5b1c...' }
                            type: { type: string, enum: [scan, redeem, adjust] }
                            at: { type: string, format: date-time }
                            delta: { type: integer }
                            title: { type: string }
                            note: { type: string, nullable: true }
                            status: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/profile/avatar:
    put:
      tags: [Profile]
      operationId: setAvatar
      summary: ตั้งรูปโปรไฟล์ (อัปโหลด หรือ preset)
      description: 'ส่ง `avatarFile` (≤2MB) หรือ `avatarUrl: "preset:<key>"` — ตั้งอย่างหนึ่งจะล้างอีกอย่าง · **Rate limit:** 30 ครั้ง/นาที/ผู้ใช้'
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AvatarInput' }
          application/json:
            schema: { $ref: '#/components/schemas/AvatarInput' }
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      operationId: removeAvatar
      summary: ลบรูปโปรไฟล์
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/profile/password:
    post:
      tags: [Profile]
      operationId: changePassword
      summary: เปลี่ยนรหัสผ่าน
      description: ออกจากระบบทุกเครื่องยกเว้นเครื่องนี้ · **Rate limit:** 5 ครั้ง/15 นาที/ผู้ใช้
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/profile/email:
    post:
      tags: [Profile]
      operationId: requestEmailChange
      summary: ขอเปลี่ยนอีเมล
      description: ส่งลิงก์ยืนยันไปอีเมลใหม่ และแจ้งเตือนอีเมลเดิม · ยืนยันด้วยรหัสผ่าน · **Rate limit:** 5 ครั้ง/15 นาที/ผู้ใช้
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: รอยืนยันอีเมลใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingEmail: { type: string, format: email }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      operationId: cancelEmailChange
      summary: ยกเลิกคำขอเปลี่ยนอีเมล
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: ยกเลิกแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/profile/email/confirm:
    post:
      tags: [Profile]
      operationId: confirmEmailChange
      summary: ยืนยันอีเมลใหม่จากลิงก์
      description: ไม่ต้องล็อกอิน (เปิดลิงก์จากเครื่องไหนก็ได้) — token คือหลักฐาน · **Rate limit:** 20 ครั้ง/15 นาที/IP
      x-auth: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '200':
          description: อีเมลใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Users
  /api/users/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      operationId: getUserAvatar
      summary: รูปโปรไฟล์ที่อัปโหลด (ไบต์รูป)
      description: สาธารณะ · Cache-Control `private, max-age=86400` (frontend ต่อท้าย `?v=` เมื่อรูปเปลี่ยน) · ไม่มีรูป/บัญชีถูกลบ → 404 ไม่มี body
      x-auth: public
      parameters:
        - name: v
          in: query
          description: cache buster
          schema: { type: string }
      responses:
        '200':
          description: รูปภาพ
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { description: ไม่มีรูป }

  # ---------------------------------------------------------------- Admin users
  /api/admin/users:
    get:
      tags: [Admin Users]
      operationId: adminListUsers
      summary: "[Admin] รายชื่อผู้ใช้"
      description: ค่าเริ่มต้น 20 ต่อหน้า (สูงสุด 100) · `status=visible` (ค่าเริ่มต้น) ซ่อนบัญชีที่ถูกลบ · search ค้นอีเมล ชื่อ เบอร์โทร
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { type: string, enum: [visible, active, suspended, deleted, all], default: visible }
        - name: role
          in: query
          schema: { type: string, enum: [admin, tourist] }
        - name: verified
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: sort
          in: query
          schema: { type: string, enum: [created, name, points, lastLogin], default: created }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: ผู้ใช้แบ่งหน้า
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUserRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Users]
      operationId: adminGetUser
      summary: "[Admin] รายละเอียดผู้ใช้"
      description: ข้อมูลส่วนตัว + ยอดรวม + สแกน/แลก/ปรับแต้มล่าสุด 50 รายการ + audit log 30 รายการ
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: รายละเอียด
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminSuspendUser
      summary: "[Admin] ระงับบัญชี"
      description: ต้องระบุเหตุผล · ระงับตัวเอง/admin คนสุดท้ายไม่ได้ · ยกเลิกทุก session ของผู้ใช้
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequired' }
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/{id}/unsuspend:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminUnsuspendUser
      summary: "[Admin] ยกเลิกการระงับ"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminDeleteUser
      summary: "[Admin] ลบบัญชี (soft delete)"
      description: ใช้ POST เพื่อส่งเหตุผลใน body · แถว/ประวัติยังอยู่ อีเมลยังสงวนไว้
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonOptional' }
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminRestoreUser
      summary: "[Admin] กู้คืนบัญชีที่ถูกลบ"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users/{id}/points:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminAdjustPoints
      summary: "[Admin] ปรับแต้มผู้ใช้"
      description: '`delta` เป็นจำนวนเต็มไม่ใช่ 0 และ |delta| ≤ 100000 · ต้องระบุเหตุผล · แต้มไม่พอให้หัก → 400'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta, reason]
              properties:
                delta: { type: integer, example: 50 }
                reason: { type: string, maxLength: 500, example: ชดเชยสแกนไม่ผ่าน }
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/revoke-sessions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminRevokeSessions
      summary: "[Admin] บังคับออกจากระบบทุกเครื่อง"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/resend-verification:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Users]
      operationId: adminResendVerification
      summary: "[Admin] ส่งอีเมลยืนยันอีกครั้ง"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  # ---------------------------------------------------------------- Admin redemptions
  /api/admin/redemptions:
    get:
      tags: [Admin Redemptions]
      operationId: adminListRedemptions
      summary: "[Admin] รายการแลกของรางวัลล่าสุด 100 รายการ"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [completed, cancelled] }
      responses:
        '200':
          description: รายการแลก
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Redemption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Redemptions]
      operationId: adminRedeem
      summary: "[Admin] แลกของรางวัลให้ผู้ใช้ที่เคาน์เตอร์"
      description: หักแต้ม ลดสต็อก และบันทึกรายการในฟังก์ชัน `admin_redeem_reward()` · แต้มไม่พอ → 402 · ของหมด → 409
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, rewardId]
              properties:
                userId: { type: string, format: uuid }
                rewardId: { type: string, format: uuid }
      responses:
        '201':
          description: แลกแล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemptionId: { type: string, format: uuid }
                  balance: { type: integer }
                  remainingStock: { type: integer, nullable: true }
                  rewardName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/redemptions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Redemptions]
      operationId: adminCancelRedemption
      summary: "[Admin] ยกเลิกการแลก (คืนแต้ม)"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequired' }
      responses:
        '200':
