    post:
      tags: [Admin Place Auto Sync]
      operationId: adminRunPlaceAutoSync
      summary: "[Admin] สั่งซิงก์อัตโนมัติทันที (1 รอบ)"
      description: 'เลือกสถานที่และเคารพเพดานต่อวัน/ต่อเดือนเหมือนรอบตามเวลา · เริ่มงาน → 202 · ไม่มีอะไรต้องซิงก์/ครบเพดาน → 200 `started: false` · มีงานซิงก์อื่นอยู่ → 409 · **Rate limit:** 6 ครั้ง/ชั่วโมง/admin · ต้องตั้ง `GOOGLE_PLACES_API_KEY`'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: ไม่ได้เริ่มงาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  reason: { type: string, enum: [cap_reached, nothing_due] }
                  message: { type: string }
        '202':
          description: เริ่มงานแล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  jobId: { type: string, format: uuid }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Error' }
