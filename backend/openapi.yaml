      description: 'ค่าที่ตั้ง การใช้คำขอของเดือนนี้เทียบเพดาน ประมาณการต่อเดือนตามความถี่ที่ตั้ง รอบถัดไป และรอบล่าสุด · ยังไม่รัน migration → 503'
