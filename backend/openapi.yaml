        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- QR & Points
  /api/qrs:
    get:
      tags: [QR & Points]
      operationId: listQrs
      summary: รายการ QR
      description: ไม่ส่ง `page`/`limit` → array · cache 25 วินาที
      x-auth: public
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: array หรือ object แบ่งหน้า
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Qr' }
                  - $ref: '#/components/schemas/QrPage'
    post:
      tags: [QR & Points]
      operationId: createQr
      summary: "[Admin] สร้าง QR ให้สถานที่"
      description: 1 QR ต่อสถานที่ (ซ้ำ → 409)
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Qr' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/qrs/meta/stats:
    get:
      tags: [QR & Points]
      operationId: qrStats
      summary: "[Admin] จำนวนสแกนและแต้มที่แจกต่อ QR"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: สถิติต่อ QR
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    qrId: { type: string, format: uuid }
                    scans: { type: integer }
                    pointsTotal: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/qrs/meta/places:
    get:
      tags: [QR & Points]
      operationId: qrPlaces
      summary: สถานที่ที่สแกนรับแต้มได้ตอนนี้
      description: QR ที่เปิดใช้และยังไม่หมดอายุ บนสถานที่ที่เปิดใช้ · `qrPoints` มาจาก QR จริง (ไม่ใช่ `places.qr_points`)
      x-auth: public
      responses:
        '200':
          description: สถานที่พร้อมข้อมูล QR
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Place'
                    - type: object
                      properties:
                        qrRadiusM: { type: integer, nullable: true, description: 'null เมื่อสถานที่ไม่มีพิกัด (ไม่ตรวจระยะ)' }
                        qrExpiresAt: { type: string, format: date-time, nullable: true }
  /api/qrs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [QR & Points]
      operationId: getQr
      summary: QR 1 รายการ
      x-auth: public
      responses:
        '200':
          description: QR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Qr' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [QR & Points]
      operationId: updateQr
      summary: "[Admin] แก้ไข QR"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrInput' }
      responses:
        '200':
          description: หลังแก้ไข
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Qr' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [QR & Points]
      operationId: deleteQr
      summary: "[Admin] ลบ QR"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: ลบแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/qrs/{id}/scan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [QR & Points]
      operationId: scanQr
      summary: สแกน QR รับแต้ม
      description: |
        แต้มและชื่อสถานที่อ่านจากฐานข้อมูลในฟังก์ชัน `claim_qr_scan()` (atomic, 1 ครั้งต่อผู้ใช้ต่อ QR)
        ถ้าสถานที่มีพิกัด ต้องส่ง `lat`/`lng` และอยู่ในรัศมี · **Rate limit:** 20 ครั้ง/นาที/ผู้ใช้
        error: 404 ไม่พบ QR · 403 QR ปิดใช้/อยู่ไกลเกิน/บัญชีใช้ไม่ได้ · 409 เคยสแกนแล้ว · 410 หมดอายุ · 422 ต้องเปิดตำแหน่ง
      x-auth: user
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number, minimum: -90, maximum: 90, example: 16.4419 }
                lng: { type: number, minimum: -180, maximum: 180, example: 102.8359 }
      responses:
        '200':
          description: ได้แต้มแล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  points: { type: integer, example: 10 }
                  placeName: { type: string }
                  balance: { type: integer, example: 120 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/points/me:
    get:
      tags: [QR & Points]
      operationId: myPoints
      summary: ยอดแต้มของฉัน
      description: การแลกของรางวัลทำโดย admin ที่เคาน์เตอร์เท่านั้น (ไม่มี endpoint แลกฝั่งผู้ใช้)
      x-auth: user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: ยอดคงเหลือ
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

