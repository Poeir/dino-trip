      tags: [Admin Place Sync]
      operationId: adminListSyncJobs
      summary: "[Admin] งานซิงก์ล่าสุด 20 งาน"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: รายการงาน
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/SyncJob'
                    - type: object
                      properties:
                        createdByName: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Place Sync]
      operationId: adminCreateSyncJob
      summary: "[Admin] สร้างงานซิงก์จาก Google (ทำงานเบื้องหลัง)"
      description: |
        ทำได้ทีละ 1 งาน (มีงานค้าง → 409) · สูงสุด 500 แห่ง · มากกว่า 100 แห่ง หรือ scope `all` ต้องส่ง `confirm: true`
        ไม่งั้นได้ 409 พร้อม `needsConfirm` และ `count` · ตอบ 202 แล้วให้ client poll `GET /jobs/{id}`
        **ค่าใช้จ่าย:** 1 แห่ง = 1 คำขอ Places API · **Rate limit:** 20 งาน/ชั่วโมง/admin
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SyncSelection'
                - type: object
                  properties:
                    fields:
                      type: array
                      items: { $ref: '#/components/schemas/SyncField' }
                    dryRun: { type: boolean, default: false }
                    confirm: { type: boolean }
      responses:
        '202':
          description: งานเข้าคิวแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: มีงานค้างอยู่ หรือ ต้องยืนยันก่อน
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      needsConfirm: { type: boolean }
                      estimatedCostThb: { type: number, description: ค่าใช้จ่ายโดยประมาณของรอบนี้ (ก่อนหักโควตาฟรีรายเดือน) }
                      count: { type: integer }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/admin/place-sync/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Place Sync]
      operationId: adminGetSyncJob
      summary: "[Admin] สถานะงานซิงก์ + ผลรายสถานที่ (สูงสุด 500)"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: งานและผล
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SyncJob'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            placeId: { type: string, format: uuid }
                            placeName: { type: string }
                            status: { type: string, enum: [updated, unchanged, skipped, failed] }
                            changedFields: { type: array, items: { $ref: '#/components/schemas/SyncField' } }
                            skippedLocked: { type: array, items: { $ref: '#/components/schemas/SyncField' } }
                            diff: { type: object, additionalProperties: true }
                            error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-sync/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Place Sync]
      operationId: adminCancelSyncJob
      summary: "[Admin] ยกเลิกงานซิงก์ที่กำลังทำ"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: งานหลังยกเลิก
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-sync/places/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Place Sync]
      operationId: adminGetPlaceSyncState
      summary: "[Admin] สถานะล็อก ค่าจาก Google ที่พักไว้ และจำนวนรายงาน ของสถานที่"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: สถานะ
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  hasGoogleId: { type: boolean }
                  lockedFields: { type: array, items: { $ref: '#/components/schemas/SyncField' } }
                  googleDiff: { type: object, additionalProperties: true }
                  lastSyncedAt: { type: string, format: date-time, nullable: true }
                  pendingReports: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-sync/places/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin Place Sync]
      operationId: adminSyncOnePlace
      summary: "[Admin] ซิงก์สถานที่ 1 แห่งทันที"
      description: |
        ฟิลด์ที่ล็อกไว้จะไม่ถูกเขียนทับ แต่ค่าใหม่ของ Google จะพักไว้ใน diff · `dryRun: true` ดูผลโดยไม่บันทึก
        **ค่าใช้จ่าย:** 1 คำขอ Places API · **Rate limit:** 120 ครั้ง/ชั่วโมง/admin
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { $ref: '#/components/schemas/SyncField' }
                dryRun: { type: boolean }
      responses:
        '200':
          description: ผลการซิงก์
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/place-sync/places/{id}/diff/{field}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: field
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SyncField' }
    post:
      tags: [Admin Place Sync]
      operationId: adminResolveGoogleDiff
      summary: "[Admin] รับ/ปัดตกค่าใหม่จาก Google ของฟิลด์ที่ล็อก"
      description: '`accept` = ใช้ค่า Google และปลดล็อก · `dismiss` = คงค่าของ admin (ยังล็อก)'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, dismiss] }
      responses:
        '200':
          description: ผล
          content:
            application/json:
              schema:
                type: object
                properties:
                  placeId: { type: string, format: uuid }
                  field: { $ref: '#/components/schemas/SyncField' }
                  action: { type: string, enum: [accept, dismiss] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-sync/places/{id}/locked-fields:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Admin Place Sync]
      operationId: adminSetLockedFields
      summary: "[Admin] ตั้งรายการฟิลด์ที่ล็อกทั้งหมด"
      description: ฟิลด์ที่ปลดล็อกจะล้างค่า Google ที่พักไว้ของฟิลด์นั้น
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lockedFields]
              properties:
                lockedFields:
                  type: array
                  items: { $ref: '#/components/schemas/SyncField' }
                  example: [hours, phone]
      responses:
        '200':
          description: รายการใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  lockedFields: { type: array, items: { $ref: '#/components/schemas/SyncField' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin place import
  /api/admin/place-import/search:
    get:
      tags: [Admin Place Import]
      operationId: adminSearchGooglePlaces
      summary: "[Admin] ค้นหาสถานที่ใน Google Maps"
      description: '**ค่าใช้จ่าย:** 1 คำขอ Places API · **Rate limit:** 120 ครั้ง/ชั่วโมง/admin · ต้องตั้ง `GOOGLE_PLACES_API_KEY` (ไม่มี → 503)'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200, example: คาเฟ่ ขอนแก่น }
      responses:
        '200':
          description: ผลค้นหา
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GoogleSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/place-import:
    post:
      tags: [Admin Place Import]
      operationId: adminImportGooglePlace
      summary: "[Admin] นำเข้าสถานที่จาก Google เป็นร่าง (ซ่อนไว้)"
      description: 'เคยนำเข้าแล้ว → 200 `created: false` · ใหม่ → 201 · **Rate limit:** 40 ครั้ง/ชั่วโมง/admin'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googlePlaceId]
              properties:
                googlePlaceId: { type: string, maxLength: 300, example: ChIJxxxxxxxxxxxxxxxx }
      responses:
        '200': { $ref: '#/components/responses/ImportResult' }
        '201': { $ref: '#/components/responses/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/admin/place-import/area-search:
    post:
      tags: [Admin Place Import]
      operationId: adminSearchGooglePlacesByArea
      summary: "[Admin] ค้นหาสถานที่ใกล้พื้นที่ที่ระบุ (ยังไม่นำเข้า)"
      description: '**ค่าใช้จ่าย:** 1 คำขอหาพิกัดพื้นที่ + 1 คำขอต่อหมวดหมู่ (ไม่ดึงรายละเอียด) · ได้สูงสุด 20 แห่งต่อหมวด · ตัดร้านที่ปิดถาวรและรีวิวน้อยกว่าเกณฑ์ออกให้ · **Rate limit:** 30 ครั้ง/ชั่วโมง/admin'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area, radius, categories]
              properties:
                area: { type: string, minLength: 2, maxLength: 200, example: พระลับ ขอนแก่น }
                radius: { type: integer, minimum: 500, maximum: 10000, description: เมตร, example: 3000 }
                categories:
                  type: array
                  items: { type: string, enum: [cafe, restaurant, attraction, shopping] }
                minReviews: { type: integer, minimum: 0, maximum: 10000, example: 5 }
      responses:
        '200':
          description: ผลค้นหา
          content:
            application/json:
              schema:
                type: object
                properties:
                  center:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      label: { type: string }
                      address: { type: string }
                  radius: { type: integer }
                  found: { type: integer, description: จำนวนที่ Google ส่งกลับก่อนกรอง }
                  hiddenClosed: { type: integer }
                  hiddenFewReviews: { type: integer }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AreaSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/place-import/publish:
    post:
      tags: [Admin Place Import]
      operationId: adminPublishPlacesBatch
      summary: "[Admin] เผยแพร่สถานที่ที่ซ่อนอยู่เป็นชุด แล้วสั่ง embed ให้"
      description: 'เปลี่ยนเฉพาะรายการที่ซ่อนอยู่ (`is_active=false`) สูงสุด 100 แห่งต่อครั้ง จากนั้นเรียก reindex (เฉพาะแถวที่ยังไม่มี embedding) แบบ best-effort — `reindex` เป็น `started` | `busy` (กำลังรันอยู่ ให้กดซ้ำจากแดชบอร์ด) | `failed` | `skipped` · **Rate limit:** 30 ครั้ง/ชั่วโมง/admin'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeIds]
              properties:
                placeIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: ผลการเผยแพร่
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: integer }
                  alreadyPublishedOrMissing: { type: integer }
                  reindex: { type: string, enum: [started, busy, failed, skipped] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/admin/place-import/batch:
    post:
      tags: [Admin Place Import]
      operationId: adminStartPlaceImportBatch
      summary: "[Admin] นำเข้าหลายสถานที่จาก Google เป็นร่าง (งานเบื้องหลัง)"
      description: 'สูงสุด 50 แห่งต่อครั้ง ทีละงาน (ซ้อน → 409) · แต่ละแห่งคือ 1 คำขอ Places Details + รูป · **Rate limit:** 6 ครั้ง/ชั่วโมง/admin · ติดตามผลด้วย GET /batch/{id}'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googlePlaceIds]
              properties:
                googlePlaceIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, maxLength: 300 }
                describe:
                  type: boolean
                  description: 'true = สร้างคำอธิบายด้วย AI ให้แห่งที่นำเข้าใหม่ที่ยังไม่มีสรุปจาก Google (1 คำขอ Serper + 1 คำขอ LLM ต่อแห่ง) · เลือกได้สูงสุด 20 แห่ง · **Rate limit เพิ่มเติม:** 3 ครั้ง/ชั่วโมง/admin'
      responses:
        '202':
          description: สร้างงานแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/admin/place-import/batch/{id}:
    get:
      tags: [Admin Place Import]
      operationId: adminGetPlaceImportBatch
      summary: "[Admin] ดูความคืบหน้างานนำเข้าเป็นชุด"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: สถานะงาน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-import/batch/{id}/cancel:
    post:
      tags: [Admin Place Import]
      operationId: adminCancelPlaceImportBatch
      summary: "[Admin] ยกเลิกงานนำเข้าเป็นชุดที่เหลือ"
      description: 'รายการที่กำลังนำเข้าอยู่จะเสร็จก่อน แล้วงานจึงหยุด'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: สถานะงาน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin place candidates
  /api/admin/place-candidates:
    get:
      tags: [Admin Place Candidates]
      operationId: adminListPlaceCandidates
      summary: "[Admin] รายการสถานที่จาก Google ที่แชทบอทแนะนำ (เรียงตามจำนวนครั้งที่แสดงในคำตอบ)"
      description: 'แชทบอทบันทึกสถานที่จาก Google ที่แสดงในคำตอบ นับไม่เกิน 1 ครั้งต่อชั่วโมงต่อสถานที่'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, imported, dismissed], default: pending } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: รายการ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        googlePlaceId: { type: string }
                        name: { type: string }
                        address: { type: string, nullable: true }
                        areaQuery: { type: string, nullable: true, description: พื้นที่ที่ผู้ใช้ถาม }
                        category: { type: string, nullable: true }
                        rating: { type: number, nullable: true }
                        reviewCount: { type: integer, nullable: true }
                        mapsUrl: { type: string, nullable: true }
                        askCount: { type: integer }
                        firstAskedAt: { type: string, format: date-time }
                        lastAskedAt: { type: string, format: date-time }
                        status: { type: string, enum: [pending, imported, dismissed] }
                        placeId: { type: string, format: uuid, nullable: true }
                        decidedAt: { type: string, format: date-time, nullable: true }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/place-candidates/count:
    get:
      tags: [Admin Place Candidates]
      operationId: adminCountPlaceCandidates
      summary: "[Admin] จำนวนที่รอพิจารณา"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: จำนวน
          content:
            application/json:
              schema: { type: object, properties: { pending: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/place-candidates/usage:
    get:
      tags: [Admin Place Candidates]
      operationId: adminPlaceCandidatesUsage
      summary: "[Admin] จำนวนครั้งที่แชทบอทค้น Google วันนี้/เดือนนี้ และค่าใช้จ่ายโดยประมาณ"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: การใช้งาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: integer }
                  month: { type: integer }
                  costPerSearchThb: { type: number }
                  monthCostThb: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/place-candidates/{gid}/import:
    post:
      tags: [Admin Place Candidates]
      operationId: adminImportPlaceCandidate
      summary: "[Admin] นำเข้า + เขียนคำอธิบายด้วย AI + ตรวจคุณภาพ แล้วเผยแพร่ถ้าผ่าน"
      description: '**ค่าใช้จ่าย:** 1 คำขอ Place Details + รูปสูงสุด 5 รูป + 1 การสร้างคำอธิบาย (Serper + LLM) · ไม่ผ่านเกณฑ์คุณภาพจะเก็บเป็นฉบับร่างซ่อนไว้พร้อมเหตุผล · **Rate limit:** 40 ครั้ง/ชั่วโมง/admin'
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: gid, in: path, required: true, schema: { type: string }, description: Google place id }
      responses:
        '200':
          description: ผลการนำเข้า
          content:
            application/json:
              schema:
                type: object
                properties:
                  placeId: { type: string, format: uuid }
                  created: { type: boolean, description: false = มีในระบบอยู่แล้ว (แค่เชื่อมโยง) }
                  description: { type: string, nullable: true, enum: [updated, skipped, failed, null] }
                  problems: { type: array, items: { type: string }, description: เหตุผลที่ไม่ผ่านเกณฑ์คุณภาพ }
                  published: { type: boolean }
                  reindex: { type: string, enum: [started, busy, failed, skipped] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: นำเข้าไปแล้ว }
        '503': { description: ยังไม่ได้ตั้งค่า GOOGLE_PLACES_API_KEY }
  /api/admin/place-candidates/{gid}/dismiss:
    post:
      tags: [Admin Place Candidates]
      operationId: adminDismissPlaceCandidate
      summary: "[Admin] ไม่สนใจสถานที่นี้ (ไม่แสดงในคิวอีก)"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: gid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: สำเร็จ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/place-candidates/{gid}/restore:
    post:
      tags: [Admin Place Candidates]
      operationId: adminRestorePlaceCandidate
      summary: "[Admin] นำรายการที่ไม่สนใจกลับเข้าคิว"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: gid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: สำเร็จ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin reindex
  /api/reindex:
    post:
      tags: [Admin Reindex]
      operationId: adminStartReindex
      summary: "[Admin] เริ่ม embed รายการที่ยังไม่มี embedding"
      description: ส่งต่อไป chatbot-service `/admin/reindex` · กำลังรันอยู่ → 409
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ReindexStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/reindex/status:
    get:
      tags: [Admin Reindex]
      operationId: adminReindexStatus
      summary: "[Admin] สถานะการ embed"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ReindexStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/reindex/pending:
    get:
      tags: [Admin Reindex]
      operationId: adminReindexPending
      summary: "[Admin] รายการที่รอ embed"
      x-auth: admin
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: รายการจาก chatbot-service
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: httpOnly session cookie ที่ได้จาก POST /api/auth/login (อายุ 30 วัน)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: หน้าที่ (เริ่ม 1) — ส่ง page หรือ limit เพื่อเปิดโหมดแบ่งหน้า
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: จำนวนต่อหน้า (ค่าเริ่มต้น/สูงสุดต่างกันตาม endpoint)
      schema: { type: integer, minimum: 1, maximum: 100 }
    Search:
      name: search
      in: query
      description: ค้นหาแบบไม่สนตัวพิมพ์ (ILIKE)
      schema: { type: string }
    Dir:
      name: dir
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    Ids:
      name: ids
      in: query
      description: id คั่นด้วย comma (ไม่ cache)
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: ข้อมูลไม่ถูกต้อง
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: ข้อมูลที่ส่งมาไม่ถูกต้อง } }
    Unauthorized:
      description: ยังไม่ได้ล็อกอิน / session หมดอายุ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: กรุณาเข้าสู่ระบบก่อน } }
    Forbidden:
      description: ไม่มีสิทธิ์
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: ไม่มีสิทธิ์เข้าถึงส่วนนี้ } }
    NotFound:
      description: ไม่พบ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: ไม่พบข้อมูล } }
    Conflict:
      description: สถานะขัดแย้ง (ซ้ำ/ทำไปแล้ว)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: เรียกถี่เกินไป
      headers:
        Retry-After:
          description: วินาทีที่ต้องรอ
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: ลองบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่อีกครั้ง } }
    BadGateway:
      description: ติดต่อบริการภายนอก (chatbot-service / Google / Cloudinary / อีเมล) ไม่ได้
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: ติดต่อ chatbot-service ไม่ได้ } }
    HealthOk:
      description: ฐานข้อมูลตอบ
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [ok] }
    HealthDown:
      description: ฐานข้อมูลไม่ตอบ
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [error] }
    UserWithCookie:
      description: สำเร็จ — ตั้ง cookie `session_token`
      headers:
        Set-Cookie:
          description: session_token=...; HttpOnly; SameSite=Lax; Path=/ (Secure ใน production)
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
    Message:
      description: ข้อความ
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Ok:
      description: สำเร็จ
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
    ProfileOk:
      description: โปรไฟล์หลังแก้ไข
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Profile' }
    AdminUserOk:
      description: แถวผู้ใช้หลังดำเนินการ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminUserRow' }
    ReportCreated:
      description: สร้างรายงานแล้ว
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
              created: { type: integer, description: จำนวนรายงานที่สร้างใหม่ }
              skipped: { type: integer, description: จำนวนฟิลด์ที่ข้าม (รายงานค้างอยู่แล้ว) }
    PendingFields:
      description: ฟิลด์ที่มีรายงานค้าง
      content:
        application/json:
          schema:
            type: object
            properties:
              pendingFields: { type: array, items: { type: string } }
    PendingCount:
      description: จำนวนที่รอ
      content:
        application/json:
          schema:
            type: object
            properties:
              pending: { type: integer }
    Closed:
      description: จำนวนรายงานที่ปิด
      content:
        application/json:
          schema:
            type: object
            properties:
              closed: { type: integer }
    ExtractResult:
      description: ฟิลด์ฟอร์มอีเวนท์ที่ LLM ดึงได้ (รูปแบบตาม chatbot-service)
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ReindexStatus:
      description: สถานะ embedder จาก chatbot-service
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ImportResult:
      description: ผลการนำเข้า
      content:
        application/json:
          schema:
            type: object
            properties:
              created: { type: boolean }
              place: { $ref: '#/components/schemas/Place' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, example: กรุณาเข้าสู่ระบบก่อน }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
    PhotoUpload:
      type: object
      required: [photoFile]
      properties:
        photoFile:
          type: string
          format: binary
          description: jpg/png/webp/gif ≤2MB
    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    ReasonRequired:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500, example: ทำผิดกติกา }
    ReasonOptional:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    ExtractInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 5000, example: 'งานไหมขอนแก่น 4-8 พ.ย. 2569 ณ ศาลากลาง เข้าฟรี' }
    Role:
      type: string
      enum: [tourist, admin]
    Title:
      type: string
      enum: [mr, mrs, miss]
    Gender:
      type: string
      enum: [male, female, unspecified]
    Occupation:
      type: string
      enum: [student, government, private_employee, business_owner, farmer, freelance, homemaker, retired, unemployed, other]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        title:
          type: string
          enum: [mr, mrs, miss, null]
          nullable: true
        avatarUrl: { type: string, nullable: true, description: '"preset:<key>" หรือ /api/users/{id}/avatar?v=...' }
        avatarPosition: { type: string, nullable: true, example: 50% 50% }
        avatarScale: { type: number, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            firstName: { type: string, nullable: true }
            lastName: { type: string, nullable: true }
            gender: { type: string, nullable: true }
            province: { type: string, nullable: true }
            district: { type: string, nullable: true }
            subdistrict: { type: string, nullable: true }
            birthdate: { type: string, format: date, nullable: true }
            occupation: { type: string, nullable: true }
            emailVerified: { type: boolean }
            pointsBalance: { type: integer }
            createdAt: { type: string, format: date-time }
    ProfileFieldsInput:
      type: object
      required: [title, firstName, lastName, phone, gender, province, district, subdistrict, birthdate, occupation]
      properties:
        title: { $ref: '#/components/schemas/Title' }
        firstName: { type: string, maxLength: 100, example: สมชาย }
        lastName: { type: string, maxLength: 100, example: ใจดี }
        phone: { type: string, pattern: '^0\d{9}$', example: '0812345678' }
        gender: { $ref: '#/components/schemas/Gender' }
        province: { type: string, maxLength: 100, example: ขอนแก่น }
        district: { type: string, maxLength: 100, example: เมืองขอนแก่น }
        subdistrict: { type: string, maxLength: 100, example: ในเมือง }
        birthdate: { type: string, format: date, example: '2000-01-31' }
        occupation: { $ref: '#/components/schemas/Occupation' }
    AvatarInput:
      type: object
      properties:
        avatarFile: { type: string, format: binary }
        avatarUrl: { type: string, example: 'preset:dino1' }
        avatarPosition: { type: string, pattern: '^\d{1,3}% \d{1,3}%$', example: 50% 50% }
        avatarScale: { type: number, minimum: 1, maximum: 3 }
    SignupInput:
      allOf:
        - type: object
          required: [email, password]
          properties:
            email: { type: string, format: email, example: tourist@example.com }
            password: { type: string, format: password, description: 'อย่างน้อย 8 ตัว มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข', example: Passw0rd! }
        - $ref: '#/components/schemas/ProfileFieldsInput'
        - $ref: '#/components/schemas/AvatarInput'

    SyncField:
      type: string
      enum: [name, address, location, hours, phone, website, business_status]
    PlaceReportField:
      type: string
      enum: [name, address, location, hours, phone, website, closed, photos, other]
    EventReportField:
      type: string
      enum: [name, date, venue, admission, status, organizer, photos, other]

    Place:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string, nullable: true, example: google }
        googlePlaceId: { type: string, nullable: true }
        name: { type: string, example: บึงแก่นนคร }
        category: { type: string, example: สถานที่ท่องเที่ยว }
        rating: { type: number, nullable: true, example: 4.6 }
        reviews: { type: integer, description: จำนวนรีวิว }
        price: { type: string, nullable: true }
        address: { type: string, nullable: true }
        district: { type: string, nullable: true, description: 'อำเภอ ไม่มีคำนำหน้า เช่น เมืองขอนแก่น' }
        subdistrict: { type: string, nullable: true, description: 'ตำบล ไม่มีคำนำหน้า' }
        province: { type: string, nullable: true }
        hours: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        mapsUrl: { type: string, nullable: true }
        desc: { type: string, nullable: true }
        amenities: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        hasQR: { type: boolean }
        qrPoints: { type: integer }
        reviewsList: { type: array, items: { type: object, additionalProperties: true } }
        location:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        subcategory: { type: string, nullable: true }
        popularBadge: { type: string, enum: [auto, show, hide] }
        img: { type: string, nullable: true, description: รูปปก (รูปที่อัปโหลดชนะรูปจาก Google) }
        images: { type: array, items: { type: string } }
        businessStatus: { type: string, nullable: true, example: OPERATIONAL }
        marketTime:
          type: string
          nullable: true
          enum: [morning, evening, all_day, null]
          description: 'หมายเหตุ: ปัจจุบัน list/detail ไม่ได้ select คอลัมน์ market_time จึงเป็น null เสมอ'
        lockedFields: { type: array, items: { $ref: '#/components/schemas/SyncField' } }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        hasGoogleDiff: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlacePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Place' }
    PlaceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200, example: คาเฟ่ทดสอบ }
        category: { type: string, example: คาเฟ่ }
        subcategory: { type: string, nullable: true, description: 'ใช้ได้เฉพาะหมวดอาหาร/คาเฟ่ (ไม่ส่ง = ไม่แตะค่าเดิม)' }
        marketTime: { type: string, nullable: true, enum: [morning, evening, all_day, null], description: เฉพาะหมวด "ตลาด" }
        rating: { type: number, minimum: 0, maximum: 5 }
        reviews: { type: integer }
        price: { type: string }
        address: { type: string }
        hours: { type: string }
        phone: { type: string }
        desc: { type: string }
        amenities:
          description: array หรือสตริงคั่นด้วย comma
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        tags:
          description: array หรือสตริงคั่นด้วย comma
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        hasQR: { type: boolean }
        qrPoints: { type: integer, minimum: 0, maximum: 10000 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        location:
          type: object
          description: ใช้แทน lat/lng ได้
          properties:
            lat: { type: number }
            lng: { type: number }
        isActive: { type: boolean, default: true }
        isFeatured: { type: boolean }
        popularBadge: { type: string, enum: [auto, show, hide] }

    EventStatus:
      type: string
      enum: [upcoming, published, cancelled]
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, nullable: true }
        dateRange: { type: string, nullable: true, description: ข้อความวันที่ตามที่บันทึก }
        dateLabel: { type: string, nullable: true, description: ข้อความวันที่สำหรับแสดงผล }
        venueName: { type: string, nullable: true }
        admission: { type: string, nullable: true }
        organizer: { type: string, nullable: true }
        suitableFor: { type: array, items: { type: string } }
        desc: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EventStatus' }
        timeStatus: { type: string, nullable: true, enum: [upcoming, ongoing, ended, cancelled, null] }
        img: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        eventStartDate: { type: string, format: date, nullable: true }
        eventEndDate: { type: string, format: date, nullable: true }
        placeId: { type: string, format: uuid, nullable: true }
        isEmbedded: { type: boolean }
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
