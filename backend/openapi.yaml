        '204': { description: ลบแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rewards/{id}/image:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Rewards]
      operationId: uploadRewardImage
      summary: "[Admin] อัปโหลด/เปลี่ยนรูปของรางวัล"
      description: 1 รูปต่อของรางวัล อัปโหลดใหม่จะแทนที่ (ลบรูปเก่าใน Cloudinary) · ไฟล์ฟิลด์ `imageFile` ≤2MB
      x-auth: admin
      security: [{ cookieAuth: [] }]
