      x-auth: public
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          schema: { type: string, enum: [name, cost] }
        - $ref: '#/components/parameters/Dir'
      responses:
        '200':
          description: array หรือ object แบ่งหน้า
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Reward' }
                  - $ref: '#/components/schemas/RewardPage'
    post:
      tags: [Rewards]
      operationId: createReward
      summary: "[Admin] เพิ่มของรางวัล"
      x-auth: admin
