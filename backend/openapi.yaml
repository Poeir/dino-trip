          application/json:
            schema: { $ref: '#/components/schemas/AutoSyncSettings' }
      responses:
        '200':
          description: การตั้งค่าและสถานะหลังบันทึก
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoSyncStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Error' }
